name: accident_alert_app
description: One Tap Accident Alert System with Nearby Hospital Locator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.2
  
  # Location Services
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # Maps - OpenStreetMap
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # HTTP Requests
  http: ^1.1.0
  
  # Twilio for SMS
  twilio_flutter: ^0.9.0
  
  # URL Launcher for Navigation
  url_launcher: ^6.2.1
  
  # Permissions
  permission_handler: ^11.0.1
  
  # State Management
  provider: ^6.1.1
  
  # Firebase Authentication & Database
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Form Validation
  email_validator: ^2.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo.png
